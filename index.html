<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/flex_container.css">
  <link rel="stylesheet" href="css/logo_container.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
    rel="stylesheet">
  <title>Scape Room Password</title>
</head>
<body>
  <header class="logo-container">
    <div class="logo-wrapper">
      <img id="main-logo" src="images/default_logo.svg" alt="logo" class="logo">
    </div>
  </header>

  <section id="teamForm">
    <span class="medium-text">Enter your team name:</span>
    <input type="text" name="team_name" placeholder="Team Name" id="team-name-input">
    <button>CONFIRM</button>
  </section>


  <section id="timeRemaining" class="hidden">
    <div class="main-view">
      <div class="empty-space"></div>

      <div class="flex-1">
        <span class="medium-text">Time remaining:</span>
        <span id="counter" class="counter"></span>
        <input id="password-input" type="password" placeholder="enter the password...">
        <button>SUBMIT</button>
      </div>

      <div id="clues" class="clues-section"></div>
    </div>
  </section>

  <section id="gameOverMenu" class="hidden">
    <span id="turnOverMessage">GAME OVER</span>
    <span id="teamPoints" class="hidden">0</span>
    <span id="timeLeft"></span>
    <button id="nextTeam">NEXT TEAM</button>
    <button id="scoreboardButton">SCOREBOARD</button>
  </section>

  <section id="scoreboard" class="hidden">
    <span>SCOREBOARD</span>
    <div id="scoreboardList"></div>
    <button id="scoreboardNextTeamTurnButton" class="mt-3">NEXT TEAM</button>
    <button id="downloadCsvButton">DOWNLOAD SCORE</button>
    <button id="resetGameDataButton" class="disabledButton">RESET GAME DATA</button>
  </section>

  <script type="module" src="config/config.js"></script>
  <script type="module" src="js/game.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
